[workspace]
members = [".", "keychain-helper"]
exclude = ["keychain-helper"]  # Don't build helper by default

[package]
name = "claude-task"
version = "0.1.0"
edition = "2021"
default-run = "claude-task"

[[bin]]
name = "claude-task"
path = "src/main.rs"

[features]
default = []
kube = ["dep:kube", "dep:k8s-openapi"]  # Enable Kubernetes support

[dependencies]
keyring = "2.3"  # Keep for cross-platform support (Windows, Linux)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive", "env"] }
regex = "1.0"
bollard = "0.17"
tar = "0.4"
futures-util = "0.3"
rmcp = { version = "0.3.0", features = ["server", "transport-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
dialoguer = "0.11"
dirs = "6.0.0"
hostname = "0.4"
sha2 = "0.10"
rand = "0.9.1"
futures = "0.3.31"
base64 = "0.22.1"

# Kubernetes dependencies - optional for cross-compilation
kube = { version = "0.87.0", features = ["runtime", "client"], optional = true }
k8s-openapi = { version = "0.20.0", features = ["v1_28"], optional = true }

[build-dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
quote = "1.0"

[dev-dependencies]
tempfile = "3.20.0"
futures-util = "0.3"
